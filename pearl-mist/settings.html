<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>珍珠雾 设置页</title>
<link rel="stylesheet" href="common.css">
<style>
.screen{height:1060px}
.body{position:absolute;top:94px;left:0;right:0;padding:0 16px;display:flex;flex-direction:column;gap:22px;z-index:2}
.sec{display:flex;flex-direction:column;gap:12px;position:relative}
.label{align-self:flex-start;font-size:14px;font-weight:600;color:#4A4462;letter-spacing:2px}
.label span{position:relative;z-index:1}
.item{width:100%;border:none;background:transparent;padding:12px 16px 12px 18px;display:flex;align-items:center;gap:14px;text-align:left;position:relative;z-index:1}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t b{font-weight:400;font-size:16px}
.item .t small{font-size:13px;color:var(--muted)}
.ico{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,254,253,.6);box-shadow:0 0 0 1px rgba(150,138,184,.45),inset 0 0 0 3px rgba(255,255,255,.8),inset 0 0 0 3.6px rgba(150,138,184,.22)}
.pearls{display:block;margin-left:68px;height:8px}
.vellum > .inpic{position:absolute;z-index:0;pointer-events:none}
</style>
</head>
<body>
<div class="screen">
  <img class="wm" src="img/castle_wm.png" alt="" style="top:330px;left:-60px;width:520px;opacity:.22">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <radialGradient id="pg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#F8EEF0"/><stop offset="1" stop-color="#E5CDD6"/></radialGradient>
    <pattern id="pearlRow" width="9" height="8" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4" r="2.3" fill="url(#pg)" stroke="#E6D3DB" stroke-width=".5"/></pattern>
  </defs></svg>
  <div class="topfade"></div>
  <button class="pearl topbtn" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E588A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12.2Q12 11.8 5 12M11 6l-6 6 6 6"/></svg></button>
  <div class="hang">
    <svg class="hang-r" style="position:absolute;left:0;top:0" width="176" height="34" viewBox="0 0 176 34" aria-hidden="true">
      <path d="M70 -2L86 12M106 -2L90 12" stroke="#9A88AC" stroke-width=".9" fill="none"/>
      <path d="M73 -2L87 11.5M103 -2L89 11.5" stroke="#C9B9D4" stroke-width=".6" fill="none"/>
    </svg>
    <div class="vellum oval" style="position:absolute;left:4px;top:24px;z-index:1;width:168px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center">
      <svg style="position:absolute;inset:0;z-index:1" width="168" height="50" viewBox="0 0 168 50" aria-hidden="true"><defs><radialGradient id="cpg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#F8EEF0"/><stop offset="1" stop-color="#E5CDD6"/></radialGradient></defs><ellipse cx="84" cy="25" rx="78" ry="20" fill="none" stroke="url(#cpg)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray=".1 5.2"/><ellipse cx="84" cy="25" rx="78" ry="20" fill="none" stroke="#E2CDD6" stroke-width=".4"/></svg>
      <span style="font-size:18px;font-weight:600;letter-spacing:6px;color:#4A4462;padding-left:6px">设置</span>
    </div>
    <svg style="position:absolute;left:58px;top:6px;z-index:0" width="60" height="37.5" viewBox="0 0 80 50" aria-hidden="true">
      <g fill="#FCF6F8" stroke="#9A88AC" stroke-width=".95" stroke-linejoin="round" stroke-linecap="round">
        <path d="M37 22C34 32 30 39 22 47L27.5 45.6L27 49.5C33 42 38 33 39.5 24Z"/>
        <path d="M43 22C46 32 50 39 58 47L52.5 45.6L53 49.5C47 42 42 33 40.5 24Z"/>
        <path d="M38 19C30 6 13 1.5 8.5 9C5 15.5 14 23.5 38 21Z"/>
        <path d="M42 19C50 6 67 1.5 71.5 9C75 15.5 66 23.5 42 21Z"/>
        <rect x="36" y="14.5" width="8" height="10.5" rx="3"/>
      </g>
      <g fill="none" stroke="#B9A9C7" stroke-width=".6" stroke-linecap="round">
        <path d="M35 18C28 11 19 8 13.5 10M35 20C27 17 18 16 12 17.5M45 18C52 11 61 8 66.5 10M45 20C53 17 62 16 68 17.5"/>
        <path d="M38.5 17v6M41.5 17v6M35 28c-2 5-5 10-9 15M45 28c2 5 5 10 9 15"/>
      </g>
    </svg>
  </div>
  <div class="body">
    <section class="sec">
      <div class="label woven"><span>账号</span></div>
      <div data-shape="stamp" data-src="img/swan_stamp.jpg" style="position:absolute;right:8px;top:-12px;width:60px;height:72px;transform:rotate(7deg);z-index:5"></div>
      <div class="vellum rose clip" style="padding:16px 20px">
        <div class="print" style="background-image:url(img/sc_angel.png);--pos:right 22%;--op:.32;width:62%"></div>
        <div style="display:flex;align-items:center;gap:14px">
          <div style="position:relative;flex:none;width:50px;height:60px">
            <div style="position:absolute;inset:4px;border-radius:50%;overflow:hidden;background:#FBF2F5"><img src="img/angel_cameo.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:62% 28%;transform:scale(1.6);transform-origin:58% 30%"></div>
            <svg style="position:absolute;inset:0" width="50" height="60" viewBox="0 0 50 60" aria-hidden="true"><ellipse cx="25" cy="30" rx="22.6" ry="27.6" fill="none" stroke="url(#pg)" stroke-width="4.4" stroke-linecap="round" stroke-dasharray=".1 5.6"/><ellipse cx="25" cy="30" rx="22.6" ry="27.6" fill="none" stroke="#E2CDD6" stroke-width=".5"/></svg>
          </div>
          <div class="halo" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:16px">已登录</span>
            <span style="font-size:13px;color:var(--muted)">example@example.com</span>
          </div>
          <button class="woven rose" style="border:none;height:36px;padding:0 14px;font-size:14px;color:#5A4250"><span style="position:relative;z-index:1">退出登录</span></button>
        </div>
      </div>
    </section>
    <section class="sec">
      <div class="label woven rose"><span>模型与对话</span></div>
      <div class="vellum clip" style="padding:6px 0">
        <div class="print" style="background-image:url(img/sc_rose.png);--pos:right 30%;--op:.5"></div>
        <div class="halo"><button class="item"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A6496" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2.2"/><path d="M10 3.5V7M14 3.5V7M10 17v3.5M14 17v3.5M3.5 10H7M3.5 14H7M17 10h3.5M17 14h3.5"/></svg></span><span class="t"><b>模型配置</b><small>默认模型、转述、语音、向量与生成模型</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#77718F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
<svg class="pearls" width="262" height="8" aria-hidden="true"><rect width="262" height="8" fill="url(#pearlRow)"/></svg>
<button class="item"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A6496" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2.1"/><circle cx="9" cy="16" r="2.1"/></svg></span><span class="t"><b>对话参数</b><small>温度、上下文、思考深度与群聊</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#77718F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
<svg class="pearls" width="262" height="8" aria-hidden="true"><rect width="262" height="8" fill="url(#pearlRow)"/></svg>
<button class="item"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A6496" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4a5 5 0 0 0-4.6 6.9l-5.9 5.9a1.9 1.9 0 0 0 2.7 2.7l5.9-5.9A5 5 0 0 0 20 9l-3 1.2-2.2-2.2L16 5"/></svg></span><span class="t"><b>工具</b><small>工具开关、自动注入与网页搜索</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#77718F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
      </div>
    </section>
    <section class="sec">
      <div class="label woven"><span>个性化与记忆</span></div>
      <div style="position:absolute;right:2px;top:-6px;z-index:5;transform:rotate(-3deg)">
        <div style="position:relative;width:184px;padding:8px 14px 9px 22px;background:#FFFDFE;border:1px solid #E5CFD9;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);box-shadow:0 2px 6px rgba(150,100,125,.14)">
          <span style="position:absolute;left:10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#F4ECF0;box-shadow:inset 0 0 0 1px #D6B5C3"></span>
          <div class="ital" style="font-size:14.5px;line-height:1.25;color:#8C6C7D">the past is false, memory is a road of no return</div>
        </div>
      </div>
      <div class="vellum clip" style="padding:6px 0">
        <div class="print" style="background-image:url(img/sc_swan.png);--pos:right center;--op:.44"></div>
        <div class="halo"><button class="item"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A6496" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.7"/><path d="M5 20c1.2-3.6 3.9-5.4 7-5.4s5.8 1.8 7 5.4"/></svg></span><span class="t"><b>个性化</b><small>全局提示词、用户画像、变量与开场消息</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#77718F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
<svg class="pearls" width="262" height="8" aria-hidden="true"><rect width="262" height="8" fill="url(#pearlRow)"/></svg>
<button class="item"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A6496" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5s-7-4.3-7-9.4A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.1c0 5.1-7 9.4-7 9.4z"/></svg></span><span class="t"><b>记忆</b><small>全局记忆</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#77718F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
<svg class="pearls" width="262" height="8" aria-hidden="true"><rect width="262" height="8" fill="url(#pearlRow)"/></svg>
<button class="item"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A6496" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></span><span class="t"><b>AI 空间</b><small>跨窗口摘要、用户档案与相关记忆</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#77718F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
      </div>
    </section>
    <section class="sec">
      <div class="label woven rose"><span>外观</span></div>
      <div class="vellum clip" style="padding:6px 0">
        <div class="print" style="background-image:url(img/sc_fawn.png);--pos:right 40%;--op:.44"></div>
        <div class="halo"><button class="item"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A6496" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13.5 6.5l4 4"/></svg></span><span class="t"><b>外观</b><small>主题、字体、颜色与插图</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#77718F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
<svg class="pearls" width="262" height="8" aria-hidden="true"><rect width="262" height="8" fill="url(#pearlRow)"/></svg>
<button class="item"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A6496" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></span><span class="t"><b>悬浮显示</b><small>灵动岛、状态栏歌词</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#77718F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
      </div>
    </section>
  </div>
</div>
<script src="shapes.js"></script>
</body>
</html>
